<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <div class="p-8 h-screen flex flex-col space-y-10 items-center justify-center bg-teal-500">

        <form class="bg-white p-8 w-full md:w-1/2 rounded-md">
            <input type="text" class="p-2 w-full focus:outline-none" required placeholder="Enter City Name!">
            <button
                class="bg-emerald-500 p-2 w-full rounded-lg my-4 text-white font-bold cursor-pointer hover:bg-emerald-700">Search
                Weather</button>
        </form>

        <div id="card" class="hidden">
            <div>
                <h1 class="text-6xl font-bold"></h1>
                <h2 class="text-lg font-semibold"></h2>
            </div>
            <div class="text-center">
                <img src="" alt="">
                <p></p>
            </div>
        </div>

    </div>
    <script src="main.js"></script>
</body>

</html>
